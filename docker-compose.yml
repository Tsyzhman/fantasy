services:
  postgres:
    image: postgres:16-alpine
    container_name: fantasy-scout-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fantasy_scout
      POSTGRES_USER: fantasy_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${FANTASY_POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - fantasy-scout-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fantasy_app -d fantasy_scout"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-setup:
    build:
      context: .
      target: setup
    profiles:
      - setup
    restart: "no"
    environment:
      DATABASE_URL: postgresql://fantasy_app:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/fantasy_scout
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET is required}
      MACHETE_FOTMOB_PROVIDER_MODE: unofficial
      MACHETE_FOTMOB_COOKIE: ${MACHETE_FOTMOB_COOKIE:-}
      MACHETE_FOTMOB_DEPLOY_ID: ${MACHETE_FOTMOB_DEPLOY_ID:-}
      MACHETE_FOTMOB_REQUEST_INTERVAL_MS: ${MACHETE_FOTMOB_REQUEST_INTERVAL_MS:-1500}
      MACHETE_FOTMOB_LEAGUE_ALIASES: ${MACHETE_FOTMOB_LEAGUE_ALIASES:-}
      MACHETE_STORE_RAW_PAYLOADS: ${MACHETE_STORE_RAW_PAYLOADS:-true}
      MACHETE_DAILY_SYNC_ENABLED: "true"
      MACHETE_DAILY_SYNC_TIME: "03:00"
      MACHETE_DAILY_SYNC_TIMEZONE: Europe/Moscow
      LEAGUE_SEASON_RETENTION_ENABLED: ${LEAGUE_SEASON_RETENTION_ENABLED:-true}
      LEAGUE_SEASON_RETENTION_TIME: ${LEAGUE_SEASON_RETENTION_TIME:-03:30}
      LEAGUE_SEASON_RETENTION_TIMEZONE: ${LEAGUE_SEASON_RETENTION_TIMEZONE:-Europe/Moscow}
      DATA_QUALITY_AUDIT_ENABLED: ${DATA_QUALITY_AUDIT_ENABLED:-true}
      DATA_QUALITY_AUDIT_SCOPES: ${DATA_QUALITY_AUDIT_SCOPES:-}
      DATA_QUALITY_AUDIT_TIME: ${DATA_QUALITY_AUDIT_TIME:-10:00}
      DATA_QUALITY_AUDIT_TIMEZONE: ${DATA_QUALITY_AUDIT_TIMEZONE:-Europe/Moscow}
      DATA_QUALITY_AUDIT_COVERAGE_PERCENT: ${DATA_QUALITY_AUDIT_COVERAGE_PERCENT:-98}
      DATA_QUALITY_AUDIT_MAXIMUM_LATENCY_HOURS: ${DATA_QUALITY_AUDIT_MAXIMUM_LATENCY_HOURS:-6}
      DATA_QUALITY_AUDIT_MAXIMUM_RUN_AGE_HOURS: ${DATA_QUALITY_AUDIT_MAXIMUM_RUN_AGE_HOURS:-26}
      SPORTS_RU_FANTASY_SYNC_ENABLED: ${SPORTS_RU_FANTASY_SYNC_ENABLED:-true}
      SPORTS_RU_FANTASY_SYNC_SCOPES: ${SPORTS_RU_FANTASY_SYNC_SCOPES:-}
      SPORTS_RU_FANTASY_SYNC_INTERVAL_HOURS: ${SPORTS_RU_FANTASY_SYNC_INTERVAL_HOURS:-6}
      SPORTS_RU_FANTASY_MAXIMUM_AGE_HOURS: ${SPORTS_RU_FANTASY_MAXIMUM_AGE_HOURS:-7}
      SPORTS_RU_FANTASY_MINIMUM_PLAYERS: ${SPORTS_RU_FANTASY_MINIMUM_PLAYERS:-100}
      SPORTS_RU_FANTASY_MINIMUM_MAPPED_PERCENT: ${SPORTS_RU_FANTASY_MINIMUM_MAPPED_PERCENT:-98}
      NEXT_PUBLIC_APP_NAME: Fantasy Scout
      DEFAULT_SEASON: 2025/26
      UPLOAD_STORAGE: local
      LOCAL_UPLOAD_DIR: /app/storage/uploads
      MAX_UPLOAD_MB: "25"
      ENABLE_BULK_UPLOAD: "true"
      ENABLE_USER_SHORTLISTS: "false"
      ENABLE_API_FOOTBALL_PROVIDER: "false"
      ENABLE_WYSCOUT_API_PROVIDER: "false"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -lc "npm run prisma:migrate:deploy && npm run db:seed"

  web:
    build:
      context: .
      target: runtime
    container_name: fantasy-scout-web
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://fantasy_app:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/fantasy_scout
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET is required}
      MACHETE_FOTMOB_PROVIDER_MODE: unofficial
      MACHETE_FOTMOB_COOKIE: ${MACHETE_FOTMOB_COOKIE:-}
      MACHETE_FOTMOB_DEPLOY_ID: ${MACHETE_FOTMOB_DEPLOY_ID:-}
      MACHETE_FOTMOB_REQUEST_INTERVAL_MS: ${MACHETE_FOTMOB_REQUEST_INTERVAL_MS:-1500}
      MACHETE_FOTMOB_LEAGUE_ALIASES: ${MACHETE_FOTMOB_LEAGUE_ALIASES:-}
      MACHETE_STORE_RAW_PAYLOADS: ${MACHETE_STORE_RAW_PAYLOADS:-true}
      INGESTION_WORKER_IN_PROCESS: "true"
      DATA_QUALITY_AUDIT_ENABLED: ${DATA_QUALITY_AUDIT_ENABLED:-true}
      DATA_QUALITY_AUDIT_SCOPES: ${DATA_QUALITY_AUDIT_SCOPES:-}
      DATA_QUALITY_AUDIT_TIME: ${DATA_QUALITY_AUDIT_TIME:-10:00}
      DATA_QUALITY_AUDIT_TIMEZONE: ${DATA_QUALITY_AUDIT_TIMEZONE:-Europe/Moscow}
      DATA_QUALITY_AUDIT_COVERAGE_PERCENT: ${DATA_QUALITY_AUDIT_COVERAGE_PERCENT:-98}
      DATA_QUALITY_AUDIT_MAXIMUM_LATENCY_HOURS: ${DATA_QUALITY_AUDIT_MAXIMUM_LATENCY_HOURS:-6}
      DATA_QUALITY_AUDIT_MAXIMUM_RUN_AGE_HOURS: ${DATA_QUALITY_AUDIT_MAXIMUM_RUN_AGE_HOURS:-26}
      SPORTS_RU_FANTASY_SYNC_ENABLED: ${SPORTS_RU_FANTASY_SYNC_ENABLED:-true}
      SPORTS_RU_FANTASY_SYNC_SCOPES: ${SPORTS_RU_FANTASY_SYNC_SCOPES:-}
      SPORTS_RU_FANTASY_SYNC_INTERVAL_HOURS: ${SPORTS_RU_FANTASY_SYNC_INTERVAL_HOURS:-6}
      SPORTS_RU_FANTASY_MAXIMUM_AGE_HOURS: ${SPORTS_RU_FANTASY_MAXIMUM_AGE_HOURS:-7}
      SPORTS_RU_FANTASY_MINIMUM_PLAYERS: ${SPORTS_RU_FANTASY_MINIMUM_PLAYERS:-100}
      SPORTS_RU_FANTASY_MINIMUM_MAPPED_PERCENT: ${SPORTS_RU_FANTASY_MINIMUM_MAPPED_PERCENT:-98}
      MACHETE_DAILY_SYNC_ENABLED: "true"
      MACHETE_DAILY_SYNC_TIME: "03:00"
      MACHETE_DAILY_SYNC_TIMEZONE: Europe/Moscow
      LEAGUE_SEASON_RETENTION_ENABLED: ${LEAGUE_SEASON_RETENTION_ENABLED:-true}
      LEAGUE_SEASON_RETENTION_TIME: ${LEAGUE_SEASON_RETENTION_TIME:-03:30}
      LEAGUE_SEASON_RETENTION_TIMEZONE: ${LEAGUE_SEASON_RETENTION_TIMEZONE:-Europe/Moscow}
      NEXT_PUBLIC_APP_NAME: Fantasy Scout
      DEFAULT_SEASON: 2025/26
      UPLOAD_STORAGE: local
      LOCAL_UPLOAD_DIR: /app/storage/uploads
      MAX_UPLOAD_MB: "25"
      ENABLE_BULK_UPLOAD: "true"
      ENABLE_USER_SHORTLISTS: "false"
      ENABLE_API_FOOTBALL_PROVIDER: "false"
      ENABLE_WYSCOUT_API_PROVIDER: "false"
    ports:
      - "127.0.0.1:${FANTASY_HOST_PORT:-3000}:3000"
    volumes:
      - fantasy-scout-uploads:/app/storage/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  fantasy-scout-postgres:
  fantasy-scout-uploads:
