name: Configure Production FPL VPN

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref containing the audited VPN configuration script.
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout exact requested ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Fetch canonical branch history
        run: git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Reject refs that omit current main
        run: git merge-base --is-ancestor origin/main HEAD

      - name: Materialize bounded AmneziaWG secret
        id: config
        shell: bash
        env:
          FPL_AMNEZIAWG_CONFIG: ${{ secrets.FPL_AMNEZIAWG_CONFIG }}
        run: |
          set -euo pipefail
          : "${FPL_AMNEZIAWG_CONFIG:?FPL_AMNEZIAWG_CONFIG secret is required}"
          umask 077
          path="$RUNNER_TEMP/fantasy-scout-fpl-amneziawg-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.conf"
          printf '%s' "$FPL_AMNEZIAWG_CONFIG" > "$path"
          size="$(stat -c '%s' "$path")"
          [[ "$size" -ge 100 && "$size" -le 16384 ]]
          checksum="$(sha256sum "$path" | awk '{print $1}')"
          {
            echo "path=$path"
            echo "checksum=$checksum"
            echo "remote_path=/tmp/$(basename "$path")"
          } >> "$GITHUB_OUTPUT"

      - name: Validate configuration script syntax
        run: bash -n scripts/configure-production-amneziawg.sh

      - name: Prepare SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          : "${DEPLOY_SSH_KEY:?DEPLOY_SSH_KEY secret is required}"
          : "${DEPLOY_HOST:?DEPLOY_HOST secret is required}"
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Transfer VPN configuration over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          LOCAL_CONFIG: ${{ steps.config.outputs.path }}
          REMOTE_CONFIG: ${{ steps.config.outputs.remote_path }}
        run: |
          set -euo pipefail
          : "${DEPLOY_USER:?DEPLOY_USER secret is required}"
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          scp -i ~/.ssh/deploy_key -P "$DEPLOY_PORT" \
            "$LOCAL_CONFIG" "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_CONFIG"

      - name: Promote verified AmneziaWG network namespace
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REMOTE_CONFIG: ${{ steps.config.outputs.remote_path }}
          CONFIG_SHA256: ${{ steps.config.outputs.checksum }}
        run: |
          set -euo pipefail
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "timeout --signal=TERM --kill-after=30s 5m bash -s -- '$REMOTE_CONFIG' '$CONFIG_SHA256'" \
            < scripts/configure-production-amneziawg.sh

      - name: Verify production remains healthy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker exec fantasy-scout-web node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""

      - name: Remove runner copy of VPN configuration
        if: always()
        env:
          LOCAL_CONFIG: ${{ steps.config.outputs.path }}
        run: rm -f -- "$LOCAL_CONFIG"
