# @spec spec://common/INFRA-006-continuous-deployment#contracts
name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify the immutable release without changing production.
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      ref:
        description: Git ref to package. It must contain the current main branch.
        required: true
        default: main
      artifact_transport:
        description: HTTPS download or bounded wait for this run's operator-prestaged verified ZIP.
        type: choice
        required: true
        default: https
        options:
          - https
          - operator-prestage
      configure_fpl_vpn:
        description: Replace the FPL network namespace from the FPL_AMNEZIAWG_CONFIG secret before deploy.
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  resolve-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version_base: ${{ steps.source.outputs.version_base }}
    steps:
      - name: Resolve requested source once
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Fetch canonical branch history
        run: git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Freeze exact source and canonical version base
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor origin/main HEAD
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "version_base=$(git rev-parse origin/main)"
          } >> "$GITHUB_OUTPUT"

  validate-source:
    needs: resolve-source
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ needs.resolve-source.outputs.commit }}
      version_base: ${{ needs.resolve-source.outputs.version_base }}

  package-and-deploy:
    needs: [resolve-source, validate-source]
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production

    steps:
      - name: Checkout validated immutable revision
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-source.outputs.commit }}
          fetch-depth: 0

      - name: Fetch canonical branch history
        run: git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Reject refs that omit current main
        run: git merge-base --is-ancestor origin/main HEAD

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Verify committed release source
        env:
          EXPECTED_COMMIT: ${{ needs.resolve-source.outputs.commit }}
        run: npm run release:verify-source -- --ci --expected-commit "$EXPECTED_COMMIT"

      - name: Verify release version against canonical branch
        run: npm run release:verify-version -- --base origin/main

      - name: Package exact Git commit
        id: release
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          tree="$(git rev-parse 'HEAD^{tree}')"
          version="$(node -p "require('./package.json').version")"
          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
          release="${timestamp}-v${version}-${commit:0:7}"
          archive="$RUNNER_TEMP/fantasy-scout-release-${release}.tar.gz"
          checksum_file="${archive}.sha256"
          git archive --format=tar.gz --output="$archive" HEAD
          checksum="$(sha256sum "$archive" | awk '{print $1}')"
          printf '%s  %s\n' "$checksum" "$(basename "$archive")" > "$checksum_file"
          {
            echo "archive=$archive"
            echo "checksum_file=$checksum_file"
            echo "checksum=$checksum"
            echo "commit=$commit"
            echo "tree=$tree"
            echo "version=$version"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

      # @spec spec://common/INFRA-006-continuous-deployment#runtime
      - name: Build immutable Linux runtime and migration images in CI
        id: images
        shell: bash
        env:
          NEXT_SERVER_ACTIONS_ID_SALT: ${{ secrets.NEXT_SERVER_ACTIONS_ID_SALT }}
          RELEASE: ${{ steps.release.outputs.release }}
          COMMIT: ${{ steps.release.outputs.commit }}
          VERSION: ${{ steps.release.outputs.version }}
          TREE: ${{ steps.release.outputs.tree }}
          SOURCE_SHA256: ${{ steps.release.outputs.checksum }}
        run: |
          set -euo pipefail
          : "${NEXT_SERVER_ACTIONS_ID_SALT:?Stable server-action ID salt is required}"
          builder="fantasy-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "FANTASY_CI_BUILDER=$builder" >> "$GITHUB_ENV"
          docker buildx create --name "$builder" --driver docker-container --use
          for target in runtime setup; do
            docker buildx build --builder "$builder" --load --provenance=false \
              --platform linux/amd64 --target "$target" \
              --secret id=server_actions_id_salt,env=NEXT_SERVER_ACTIONS_ID_SALT \
              --build-arg "APP_RELEASE_COMMIT=$COMMIT" --build-arg "APP_RELEASE_VERSION=$VERSION" \
              --tag "fantasy-scout-ci:${COMMIT}-${target}" .
          done
          runtime_id="$(docker image inspect "fantasy-scout-ci:${COMMIT}-runtime" --format '{{.Id}}')"
          setup_id="$(docker image inspect "fantasy-scout-ci:${COMMIT}-setup" --format '{{.Id}}')"
          for image_id in "$runtime_id" "$setup_id"; do
            docker run --rm --network none --entrypoint node "$image_id" \
              -e 'if(process.version!=="v"+process.argv[1])process.exit(1);console.log(JSON.stringify({node:process.version,uid:process.getuid()}))' \
              "$(cat .nvmrc)"
          done
          docker run --rm --network none --entrypoint node "$runtime_id" \
            -e 'if(process.getuid()===0)process.exit(1)'
          docker run --rm --network none --entrypoint sh "$setup_id" -ec '
            test ! -e /app/.next
            test -d /app/prisma/migrations
            test -f /app/prisma/seed.ts
            test -f /app/scripts/sync-production-fantasy-prices.ts
            node -e "require(\"@prisma/client\")"
            npm run prisma:migrate:deploy -- --help >/dev/null
          '
          images_archive="$RUNNER_TEMP/fantasy-scout-images-${RELEASE}.tar.gz"
          docker save "fantasy-scout-ci:${COMMIT}-runtime" "fantasy-scout-ci:${COMMIT}-setup" | gzip -1 > "$images_archive"
          images_sha="$(sha256sum "$images_archive" | awk '{print $1}')"
          manifest="$RUNNER_TEMP/fantasy-scout-images-${RELEASE}.json"
          printf '{"commit":"%s","tree":"%s","version":"%s","runtimeImageId":"%s","setupImageId":"%s","archiveSha256":"%s","sourceArchiveSha256":"%s","runId":"%s","runAttempt":"%s","repositoryId":"%s"}\n' \
            "$COMMIT" "$TREE" "$VERSION" "$runtime_id" "$setup_id" "$images_sha" "$SOURCE_SHA256" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_REPOSITORY_ID" > "$manifest"
          {
            echo "archive=$images_archive"
            echo "sha256=$images_sha"
            echo "runtime_id=$runtime_id"
            echo "setup_id=$setup_id"
            echo "manifest=$manifest"
          } >> "$GITHUB_OUTPUT"

      - name: Remove only this CI build cache
        if: always() && env.FANTASY_CI_BUILDER != ''
        run: docker buildx rm --force "$FANTASY_CI_BUILDER"

      - name: Retain immutable release archive and image manifest
        id: artifact
        uses: actions/upload-artifact@v6
        with:
          name: production-release-${{ steps.release.outputs.release }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            ${{ steps.release.outputs.archive }}
            ${{ steps.release.outputs.checksum_file }}
            ${{ steps.images.outputs.archive }}
            ${{ steps.images.outputs.manifest }}
          if-no-files-found: error
          retention-days: 14

      - name: Report dry run
        if: inputs.dry_run == 'true'
        run: |
          printf 'DRY_RUN release=%s version=%s commit=%s tree=%s sha256=%s\n' \
            '${{ steps.release.outputs.release }}' \
            '${{ steps.release.outputs.version }}' \
            '${{ steps.release.outputs.commit }}' \
            '${{ steps.release.outputs.tree }}' \
            '${{ steps.release.outputs.checksum }}'

      - name: Materialize bounded AmneziaWG secret
        if: inputs.dry_run == 'false' && inputs.configure_fpl_vpn == 'true'
        id: fpl_vpn_config
        shell: bash
        env:
          FPL_AMNEZIAWG_CONFIG: ${{ secrets.FPL_AMNEZIAWG_CONFIG }}
        run: |
          set -euo pipefail
          : "${FPL_AMNEZIAWG_CONFIG:?FPL_AMNEZIAWG_CONFIG secret is required}"
          umask 077
          path="$RUNNER_TEMP/fantasy-scout-fpl-amneziawg-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.conf"
          printf '%s' "$FPL_AMNEZIAWG_CONFIG" > "$path"
          size="$(stat -c '%s' "$path")"
          [[ "$size" -ge 100 && "$size" -le 16384 ]]
          checksum="$(sha256sum "$path" | awk '{print $1}')"
          {
            echo "path=$path"
            echo "checksum=$checksum"
            echo "remote_path=/tmp/$(basename "$path")"
          } >> "$GITHUB_OUTPUT"

      # @spec spec://common/INFRA-006-continuous-deployment#contracts
      - name: Prepare pinned SSH identity
        if: inputs.dry_run == 'false'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: python3 -B scripts/prepare-deploy-ssh.py

      - name: Transfer VPN configuration over SSH
        if: inputs.dry_run == 'false' && inputs.configure_fpl_vpn == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          LOCAL_CONFIG: ${{ steps.fpl_vpn_config.outputs.path }}
          REMOTE_CONFIG: ${{ steps.fpl_vpn_config.outputs.remote_path }}
        run: |
          set -euo pipefail
          : "${DEPLOY_USER:?DEPLOY_USER secret is required}"
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          scp -F ~/.ssh/deploy_config -i ~/.ssh/deploy_key -P "$DEPLOY_PORT" \
            "$LOCAL_CONFIG" "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_CONFIG"

      - name: Promote verified AmneziaWG network namespace
        if: inputs.dry_run == 'false' && inputs.configure_fpl_vpn == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REMOTE_CONFIG: ${{ steps.fpl_vpn_config.outputs.remote_path }}
          CONFIG_SHA256: ${{ steps.fpl_vpn_config.outputs.checksum }}
        run: |
          set -euo pipefail
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          ssh -F ~/.ssh/deploy_config -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "AMNEZIAWG_ALLOW_BOOTSTRAP=1 timeout --signal=TERM --kill-after=30s 5m bash -s -- '$REMOTE_CONFIG' '$CONFIG_SHA256'" \
            < scripts/configure-production-amneziawg.sh

      - name: Remove runner copy of VPN configuration
        if: always() && inputs.configure_fpl_vpn == 'true'
        env:
          LOCAL_CONFIG: ${{ steps.fpl_vpn_config.outputs.path }}
        run: rm -f -- "$LOCAL_CONFIG"

      - name: Verify production remains healthy after VPN rotation
        if: inputs.dry_run == 'false' && inputs.configure_fpl_vpn == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          ssh -F ~/.ssh/deploy_config -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker exec fantasy-scout-web node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""

      - name: Reject production history rollback
        if: inputs.dry_run == 'false'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          CANDIDATE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          set -euo pipefail
          : "${DEPLOY_USER:?DEPLOY_USER secret is required}"
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          current_commit="$(
            ssh -F ~/.ssh/deploy_config -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "test -f /var/www/fantasy-scout-current/.release-commit && cat /var/www/fantasy-scout-current/.release-commit || true"
          )"
          if [[ "$current_commit" =~ ^[0-9a-f]{40}$ ]]; then
            git cat-file -e "${current_commit}^{commit}"
            git merge-base --is-ancestor "$current_commit" "$CANDIDATE_COMMIT"
          else
            printf 'Current production predates commit manifests; first guarded deployment is allowed.\n'
          fi

      # @spec spec://common/INFRA-006-continuous-deployment#contracts
      - name: Deliver and verify this run's immutable artifact
        if: inputs.dry_run == 'false'
        timeout-minutes: 52
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
          ARTIFACT_TRANSPORT: ${{ inputs.artifact_transport }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          LOCAL_ARCHIVE: ${{ steps.release.outputs.archive }}
          CHECKSUM_FILE: ${{ steps.release.outputs.checksum_file }}
          IMAGES_ARCHIVE: ${{ steps.images.outputs.archive }}
          IMAGE_MANIFEST: ${{ steps.images.outputs.manifest }}
          RELEASE: ${{ steps.release.outputs.release }}
          RELEASE_CHECKSUM: ${{ steps.release.outputs.checksum }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          RELEASE_TREE: ${{ steps.release.outputs.tree }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          IMAGES_SHA256: ${{ steps.images.outputs.sha256 }}
          RUNTIME_IMAGE_ID: ${{ steps.images.outputs.runtime_id }}
          SETUP_IMAGE_ID: ${{ steps.images.outputs.setup_id }}
        run: python3 -B scripts/transfer-ci-artifact.py

      - name: Promote Docker release
        if: inputs.dry_run == 'false'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE: ${{ steps.release.outputs.release }}
          RELEASE_CHECKSUM: ${{ steps.release.outputs.checksum }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          RELEASE_TREE: ${{ steps.release.outputs.tree }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          IMAGES_SHA256: ${{ steps.images.outputs.sha256 }}
          RUNTIME_IMAGE_ID: ${{ steps.images.outputs.runtime_id }}
          SETUP_IMAGE_ID: ${{ steps.images.outputs.setup_id }}
        run: |
          set -euo pipefail
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          remote_archive="/tmp/fantasy-scout-release-${RELEASE}.tar.gz"
          ssh -F ~/.ssh/deploy_config -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$remote_archive' '$RELEASE_CHECKSUM' '$RELEASE' '$RELEASE_COMMIT' '$RELEASE_TREE' '$RELEASE_VERSION' '/tmp/fantasy-scout-images-${RELEASE}.tar.gz' '$IMAGES_SHA256' '$RUNTIME_IMAGE_ID' '$SETUP_IMAGE_ID'" \
            < scripts/deploy-production-docker.sh

      - name: Verify exact production revision
        if: inputs.dry_run == 'false'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          set -euo pipefail
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          ssh -F ~/.ssh/deploy_config -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker exec fantasy-scout-web node -e \"fetch('http://127.0.0.1:3000/api/health').then(async r=>{const p=await r.json();console.log(JSON.stringify(p));process.exit(r.ok&&p.release?.commit===process.argv[1]?0:1)}).catch(()=>process.exit(1))\" '$RELEASE_COMMIT'"

      - name: Remove runner SSH material
        if: always()
        run: rm -f -- ~/.ssh/deploy_key ~/.ssh/deploy_known_hosts ~/.ssh/deploy_config
