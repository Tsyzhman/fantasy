name: Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fantasy_scout_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fantasy_scout_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Check Prisma migration drift
        run: npm run prisma:migrate:diff
        env:
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fantasy_scout_test?schema=prisma_shadow

      - name: Run database integration tests
        run: npm run prisma:migrate:deploy && npm run test:db
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fantasy_scout_test?schema=public

      - name: Run checks
        run: npm run check
