name: Production Monitor

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Check production and synchronize alert issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MONITOR_BASE_URL: https://fantasy.tsyzhman.ru
          MONITOR_FIXED_WINDOW_EXPECTED_START: ${{ vars.MONITOR_FIXED_WINDOW_EXPECTED_START }}
          MONITOR_FIXED_WINDOW_ENABLED: ${{ vars.MONITOR_FIXED_WINDOW_ENABLED || 'false' }}
          MONITOR_FIXED_WINDOW_MIN_OBSERVED_SPAN_MINUTES: ${{ vars.MONITOR_FIXED_WINDOW_MIN_OBSERVED_SPAN_MINUTES }}
        run: node scripts/production-monitor.mjs
